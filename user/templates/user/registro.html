{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
  <div class="grid items-start gap-12 md:grid-cols-2">
    <div class="md:sticky md:top-24">
      <p class="etiqueta mb-4">Nueva cuenta</p>
      <h1 class="text-6xl">Únete a<br>la <span class="cursiva">mesa.</span></h1>
      <p class="max-w-sm text-hueso-2">Solo necesitas un nombre de usuario, un correo y una contraseña.</p>
    </div>
    <div class="tarjeta p-8">
      <h2 class="mt-0 mb-6">Crear cuenta</h2>
      <form method="post" class="formulario">
        {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
        {{ form.as_p }}
        <button type="submit" class="btn-primario mt-2 w-full py-3">Registrarse</button>
      </form>
      <p class="mt-6 text-sm text-hueso-2">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div>
  </div>
{% endblock %}
