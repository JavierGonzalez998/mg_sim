# Proxy delante de Daphne: sirve /static/ y reenvía HTTP y WebSockets a la app.
upstream django {
    server web:8000;
}

# WebSockets: "Connection: upgrade" solo si el cliente pidió cambiar de protocolo.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Si ya hay otro proxy con HTTPS delante (balanceador, Cloudflare...), respeta su esquema.
map $http_x_forwarded_proto $esquema {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Estáticos con hash en el nombre (CompressedManifestStaticFilesStorage): caché de un año.
    location /static/ {
        alias /usr/share/nginx/static/;
        gzip_static on;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema;
        # Las partidas pueden pasar mucho tiempo sin mensajes.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema;
        proxy_read_timeout 60s;
    }
}
